# docker-compose.yml - auto-identity-remove
#
# One-off run:        docker compose run --rm watcher
# Preview only:       docker compose run --rm watcher node watcher.js --dry-run
#
# Runs are manual only: this fork does not schedule them.
# docs/SYNOLOGY.md has a worked NAS example.

services:
  watcher:
    build: .
    # node runs as PID 1 without this, so `docker stop` cannot reap the Chromium
    # children and the state lock is left behind - wedging the next run.
    init: true
    user: pwuser
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    secrets:
      - aidr-passphrase
    volumes:
      # Not :ro - config.json is written back by --encrypt-config and by the
      # right-to-know pending-request bookkeeping.
      - ./config.json:/app/config.json
      - ./state.json:/app/state.json
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - AIDR_PASSPHRASE_FILE=/run/secrets/aidr-passphrase
      # Container clocks are UTC. Report timestamps use local time, so set
      # this to your zone or they land at the wrong hour.
      - TZ=${TZ:-UTC}
      # Set to 1 on hosts with ~2GB RAM. See docs/SYNOLOGY.md.
      - AIDR_LOW_MEMORY=${AIDR_LOW_MEMORY:-0}
    # Docker defaults /dev/shm to 64MB; Chromium renderers exhaust that and die.
    # The code also passes --disable-dev-shm-usage so a plain `docker run`
    # without this setting still works, but a real shm is faster.
    shm_size: 512mb

secrets:
  aidr-passphrase:
    # chmod 600 this file on the host. Remove this block and the service's
    # `secrets:` / AIDR_PASSPHRASE_FILE lines if you do not encrypt the config.
    file: ./secrets/aidr-passphrase
